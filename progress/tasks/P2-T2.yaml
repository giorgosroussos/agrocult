  Filament resources in backend/app/Modules/Catalogue/Filament/Resources: Plants (tabs for structured fields, texts, aliases, calendar per zone, companions, care intervals, photos, sources), PlantCategories, ClimateZones (rules as JSON object), Tips; labels in Catalogue/resources/lang/{en,el}/panel.php (catalogue::panel).
