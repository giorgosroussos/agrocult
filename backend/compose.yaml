# Development environment (OPS-004): Laravel Sail with PHP 8.3, PostgreSQL 18,
# a queue worker and the scheduler. Start with: ./vendor/bin/sail up -d
# Ports and the project name come from .env (APP_PORT, FORWARD_DB_PORT, COMPOSE_PROJECT_NAME).
x-app: &app
    build:
        context: ./vendor/laravel/sail/runtimes/8.3
        dockerfile: Dockerfile
        args:
            WWWGROUP: '${WWWGROUP:-1000}'
    image: agrocult-sail-8.3/app
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    environment: &app-env
        WWWUSER: '${WWWUSER:-1000}'
        LARAVEL_SAIL: 1
        XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
        XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
        IGNITION_LOCAL_SITES_PATH: '${PWD}'
        # Container topology: the app always talks to the pgsql service.
        DB_CONNECTION: pgsql
        DB_HOST: pgsql
        DB_PORT: 5432
        DB_DATABASE: '${DB_DATABASE:-agrocult}'
        DB_USERNAME: '${DB_USERNAME:-sail}'
        DB_PASSWORD: '${DB_PASSWORD:-secret}'
        # Structured logs on stdout/stderr (OPS-002)
        LOG_CHANNEL: stderr
    volumes:
        - '.:/var/www/html'
    networks:
        - sail
    depends_on:
        pgsql:
            condition: service_healthy

services:
    # API (and later the Filament admin panel)
    laravel.test:
        <<: *app
        ports:
            - '${APP_PORT:-8000}:80'

    # Queue worker (database driver)
    queue:
        <<: *app
        environment:
            <<: *app-env
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan queue:work --sleep=3 --tries=3'

    # Scheduler
    scheduler:
        <<: *app
        environment:
            <<: *app-env
            SUPERVISOR_PHP_COMMAND: '/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan schedule:work'

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE:-agrocult}'
            POSTGRES_USER: '${DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE:-agrocult}', '-U', '${DB_USERNAME:-sail}']
            interval: 5s
            retries: 10
            timeout: 5s

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
