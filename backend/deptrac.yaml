# Module boundaries from design/model/architecture.yaml (may_depend_on).
# Every module may also use the shared code in App\ outside App\Modules
# (App\Support, App\Http, App\Providers); shared code may not use modules.
deptrac:
    paths:
        - ./app
    layers:
        - name: Shared
          collectors:
              - type: classLike
                value: '^App\\(?!Modules\\).*'
        - name: Identity
          collectors:
              - type: classLike
                value: '^App\\Modules\\Identity\\.*'
        - name: Catalogue
          collectors:
              - type: bool
                must:
                    - type: classLike
                      value: '^App\\Modules\\Catalogue\\.*'
                must_not:
                    - type: classLike
                      value: '^App\\Modules\\Catalogue\\(Services\\ClimateZones|Events\\ClimateZoneRulesChanged)$'
        # DATA-009: the public climate-zone API of CMP-Catalogue, the only part CMP-Weather may use.
        - name: CatalogueClimateZones
          collectors:
              - type: classLike
                value: '^App\\Modules\\Catalogue\\(Services\\ClimateZones|Events\\ClimateZoneRulesChanged)$'
        - name: Weather
          collectors:
              - type: classLike
                value: '^App\\Modules\\Weather\\.*'
        - name: Gardens
          collectors:
              - type: classLike
                value: '^App\\Modules\\Gardens\\.*'
        - name: Identification
          collectors:
              - type: classLike
                value: '^App\\Modules\\Identification\\.*'
        - name: Notifications
          collectors:
              - type: classLike
                value: '^App\\Modules\\Notifications\\.*'
        - name: Privacy
          collectors:
              - type: classLike
                value: '^App\\Modules\\Privacy\\.*'
    ruleset:
        Shared: ~
        Identity: [Shared]
        Catalogue: [Shared, Identity, CatalogueClimateZones]
        CatalogueClimateZones: [Shared, Catalogue]
        Weather: [Shared, CatalogueClimateZones]
        Gardens: [Shared, Identity, Catalogue, CatalogueClimateZones, Weather]
        Identification: [Shared, Identity, Catalogue, CatalogueClimateZones, Gardens]
        Notifications: [Shared, Identity, Catalogue, CatalogueClimateZones, Weather, Gardens]
        Privacy: [Shared, Identity, Gardens, Identification, Notifications]
