    depends_on: [P5-T1]
    use_cases: [UC-005]
    touches: {writes: [CMP-AppCatalogue], reads: [CMP-Identification, CMP-AppGardens], hotspots: [mobile/lib/app/router.dart, mobile/lib/l10n/app_el.arb, mobile/lib/l10n/app_en.arb]}
out_of_scope: ["Disease diagnosis (non-goal)"]
