ownership:
  - {id: OWN-001, entity: ENT-Garden, rule: "A gardener reads and changes only gardens where they have a GardenMember row", applies_to: [ROLE-Gardener], source: inferred, confirmed: true}
  - {id: OWN-002, entity: ENT-GardenPlant, rule: "A gardener reads and changes only plants of gardens they are a member of", applies_to: [ROLE-Gardener], source: inferred, confirmed: true}
  - {id: OWN-003, entity: ENT-CareLog, rule: "A gardener reads and changes only care log entries of plants in gardens they are a member of", applies_to: [ROLE-Gardener], source: inferred, confirmed: true}
  - {id: OWN-004, entity: ENT-Notification, rule: "A gardener reads only notifications where user_id is their own id", applies_to: [ROLE-Gardener], source: inferred, confirmed: true}
  - {id: OWN-005, entity: ENT-PushToken, rule: "A gardener registers and removes only their own push tokens", applies_to: [ROLE-Gardener], source: inferred, confirmed: true}
  - {id: OWN-006, entity: ENT-Identification, rule: "A gardener reads only their own identification requests", applies_to: [ROLE-Gardener], source: inferred, confirmed: true}
  - {id: OWN-007, entity: ENT-User, rule: "A gardener reads, changes, exports and deletes only their own account", applies_to: [ROLE-Gardener], source: inferred, confirmed: true}
  - {id: OWN-008, entity: ENT-GardenMember, rule: "A gardener sees only memberships of gardens they are a member of", applies_to: [ROLE-Gardener], source: inferred, confirmed: true}
  - {id: OWN-009, entity: ENT-Garden, rule: "A curator has no access to gardens, garden plants, care log or notifications of users", applies_to: [ROLE-Curator], source: inferred, confirmed: true}
