decisions:
  - id: DATA-001
    area: data
    topic: climate_zones
    title: Climate zones computed per weather cell from historical data
    status: decided
    source: inferred
    confirmed: true
    user_statement: "1 β"
    decision: "Each weather cell gets climate metrics from the Open-Meteo historical archive (mean winter minimum temperature, mean last spring frost and first autumn frost dates, elevation). The metrics map the cell to one of 4-5 named climate zones; gardens take the zone of their cell. Zone thresholds and names are curator-managed data."
    rationale: "Distinguishes Crete from Florina and two villages of the same prefecture at different altitudes, while curators fill calendars for only 4-5 zones."
    alternatives_rejected: ["fixed zones by region and altitude: too coarse"]
    constraints:
      - "MUST derive a garden's climate zone from its weather cell, never from user input"
      - "MUST store zone thresholds as data, not in code"
      - "MUST compute cell climate metrics once per cell and reuse them"
    affects: [ENT-ClimateZone, ENT-WeatherCell, ENT-Garden]

  - id: DATA-002
    area: data
    topic: initial_catalogue
    title: Plants in the first catalogue
    status: decided
    source: inferred
    confirmed: true
    user_statement: "Η λίστα είναι οκ"
    decision: "42 plants in 10 categories (list in rationale)."
    rationale: "Fruit vegetables: tomato, pepper, aubergine, okra. Cucurbits: courgette, cucumber, watermelon, melon. Leafy and brassicas: lettuce, spinach, cabbage, broccoli, chard, rocket. Roots and bulbs: potato, carrot, beetroot, onion, garlic, leek. Legumes: green beans, broad beans, peas. Aromatic herbs: basil, mint, oregano, thyme, rosemary, parsley, dill, lavender. Citrus: lemon, orange, mandarin. Fruit trees: olive, fig, pomegranate, almond, apricot. Vines: grapevine. Flowers: geranium, marigold (Tagetes)."

  - id: DATA-003
    area: data
    topic: content_review
    title: The owner reviews content in the MVP
    status: decided
    source: inferred
    confirmed: true
    user_statement: "3 α"
    decision: "The owner reviews and publishes catalogue content in the MVP; an agronomist joins as curator when available. Weather thresholds remain initial values until an agronomist checks them."
    affects: [UC-010]

  - id: DATA-004
    area: data
    title: Plant categories as curator-managed data
    status: decided
    source: user
    user_statement: "θα ήθελα επίσης τα φυτά να κατηγοριοποιούνται (π.χ. αρρωματικά, εσπεριδοειδή, καρποφόρα, κ.λπ)"
    decision: "Categories are a catalogue table with Greek and English names and an optional parent, so curators can add or regroup them. Each plant has one primary category; search filters by category."
    constraints:
      - "MUST NOT hard-code plant categories in the app or the backend"

  - id: DATA-005
    area: data
    title: Removing a garden plant archives it
    status: decided
    source: inferred
    confirmed: true
    user_statement: "4 α"
    decision: "Removing a plant from a garden sets archived_at; it disappears from the garden and produces no notifications, its care log stays for season comparison. Deleting a garden or an account still hard-deletes everything."
    constraints:
      - "MUST exclude archived garden plants from garden lists and from notification rules"
    affects: [UC-011, ENT-GardenPlant]

  - id: DATA-006
    area: data
    title: Data model defaults
    status: decided
    source: default
    confirmed: true
    user_statement: "Για της προεπιλογές είμαι εντάξει."
    decision: "UUID keys; UTC timestamps; ISO language codes; identification photos not stored, results kept 30 days; forecasts kept 7 days, notifications 90 days; user data until account deletion; owners may edit or delete their care log entries; tips in Greek and English; audit trail on catalogue plant changes."
    constraints:
      - "MUST NOT store identification photos after the provider call"
      - "MUST use UUID primary keys"
    global: true

  - id: DATA-007
    area: data
    title: Personal season insights
    status: deferred
    source: inferred
    confirmed: true
    user_statement: "Θα μπορούσαμε εφόσον κρατάμε δεδομένα για κάθε λογαριασμό να τα χρησιμοποιούμε για να προσφέρουμε στον χρήστη κάποιες πληροφορίες σχετικά με την δραστηριότητα του μέσα στο χρόνο/σεζόν ;"
    decision: "A 'My season' view with the user's own statistics (planting dates year over year, care actions per month and plant, watering vs rain, harvest per plant and season) comes after the MVP; the MVP stores what it needs."
    deferred_to: "after MVP"
    trigger: "Users have at least one full season of data"
    requirements: ["Only the user's own data", "Comparison across seasons", "Watering compared with actual rain"]
    prepare_now:
      - "MUST allow an optional harvest quantity and unit on care log entries"
      - "MUST keep a permanent daily weather summary (rain mm, min and max temperature) per weather cell"
    affects: [ENT-CareLog, ENT-WeatherDaily]

  - id: DATA-008
    area: data
    title: Anonymous regional insights from all users
    status: deferred
    source: user
    user_statement: "2 ναι"
    decision: "Aggregated, anonymised activity by area (e.g. 'gardeners near you are sowing garlic now') is a post-MVP idea."
    deferred_to: "after MVP"
    trigger: "Enough users per area"
    requirements: ["Anonymisation", "Minimum number of users per area before showing any figure", "Disclosure in the privacy policy"]
    prepare_now:
      - "MUST NOT show or export any data of one user to another user"

  - id: DATA-009
    area: data
    topic: climate_zones
    title: Climate metric computation and zone matching
    status: decided
    source: inferred
    confirmed: true
    user_statement: "Nearest zone (Recommended); Accept as proposed (Recommended); Event-driven (Recommended)"
    decision: "Refines DATA-001 (CR-P3-T1-1). Cell metrics come from one Open-Meteo archive call per cell covering the last 10 full calendar years. Frost is a daily minimum <= 0 °C. winter_min_mean_c is the mean over the years of the mean daily minimum of that year's coldest calendar month. last_frost_doy / first_frost_doy are the mean day of year of the last frost before 1 July / first frost after 1 July over the years that had such a frost, and null when fewer than half of the years had one. Zone rules are JSON {\"<metric>\": {\"min\": number|null, \"max\": number|null}} with metric keys elevation_m, winter_min_mean_c, last_frost_doy, first_frost_doy; min inclusive, max exclusive, null unbounded, other keys ignored. A cell gets the zone with the smallest distance, the sum over its rule metrics of how far the cell value lies outside the bounds (0 = match); ties go to the lowest code. For matching only, a null last_frost_doy counts as 0 and a null first_frost_doy as 366. When a curator changes zone rules, CMP-Catalogue emits ClimateZoneRulesChanged; CMP-Weather re-assigns all cells in a queued job and emits CellZoneChanged for every cell whose zone changed; CMP-Gardens updates the zone of that cell's gardens. CMP-Weather reads zones only through a public CMP-Catalogue service (ClimateZones) that returns id, code and rules as plain data."
    rationale: "Every cell with metrics always gets a zone, even when curator thresholds leave gaps or overlap; 10 years in one call keeps the archive volume to ~1,500 calls once for all of Greece (ORG-001); events keep module boundaries."
    alternatives_rejected: ["first matching zone, else no zone: gardens lose their calendar on a curator gap", "30-year normal: more data per call for little gain", "no re-assignment on rule change: existing gardens keep stale zones"]
    constraints:
      - "MUST compute cell climate metrics from the last 10 full calendar years of the Open-Meteo archive in one history call per cell"
      - "MUST treat a daily minimum <= 0 °C as frost"
      - "MUST store last_frost_doy / first_frost_doy as null when fewer than half of the years had such a frost"
      - "MUST match zone rules with min inclusive, max exclusive and null as unbounded, ignoring unknown keys"
      - "MUST assign every cell with metrics the zone with the smallest distance, ties by lowest code"
      - "MUST re-assign all cells in a queued job when zone rules change, and update the zone of the affected gardens"
      - "MUST read climate zones in CMP-Weather only through the CMP-Catalogue ClimateZones service, never its models"
    affects: [ENT-ClimateZone, ENT-WeatherCell, ENT-Garden]
